services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteer-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-volunteer_db}
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: volunteer-redis
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    container_name: volunteer-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-volunteer_db}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      FEATURE_EXCEL_IMPORT: ${FEATURE_EXCEL_IMPORT:-true}
      BACKUP_DIR: /app/backups
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_BACKUP_BUCKET: ${SUPABASE_BACKUP_BUCKET:-}
      SUPABASE_BACKUP_PREFIX: ${SUPABASE_BACKUP_PREFIX:-postgres}
      IMPORT_SOURCE_DIR: /app/import-sources/2025-2026志愿者时长库3月公示
      IMPORT_SOURCE_DIRS: /app/import-sources/2025-2026志愿者时长库3月公示||/app/import-sources/2025-2026志愿者时长库4月公示||/app/import-sources/2025-2026志愿者时长库5月
      ACADEMIC_YEAR_START_MONTH: ${ACADEMIC_YEAR_START_MONTH:-9}
      ACADEMIC_UPPER_MONTHS: ${ACADEMIC_UPPER_MONTHS:-9,10,11,12,1}
      ACADEMIC_VACATION_MONTHS: ${ACADEMIC_VACATION_MONTHS:-2,7,8}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ./backups:/app/backups:ro
      - ./2025-2026志愿者时长库3月公示:/app/import-sources/2025-2026志愿者时长库3月公示:ro
      - ./2025-2026志愿者时长库4月公示:/app/import-sources/2025-2026志愿者时长库4月公示:ro
      - ./2025-2026志愿者时长库5月:/app/import-sources/2025-2026志愿者时长库5月:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: volunteer-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend-query/dist:/usr/share/nginx/html/query
      - ./frontend-admin/dist:/usr/share/nginx/html/admin
      - ./frontend-status:/usr/share/nginx/html/status:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
